name: SafeFolder
options:
  bundleIdPrefix: com.safefolder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: SafeFolder/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  SafeFolder:
    type: application
    platform: iOS
    sources:
      - path: SafeFolder
        excludes:
          - "Resources/Assets.xcassets/AppIcon.appiconset"
    resources:
      - path: SafeFolder/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safefolder.app
        INFOPLIST_FILE: SafeFolder/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: SafeFolder/Info.plist
